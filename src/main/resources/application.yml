cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:placeholder-key}
      secret-key: ${AWS_SECRET_KEY:placeholder-secret}
    region:
      static: sa-east-1
    stack:
      auto: false

application:
  bucket:
    name: api-astral
  storage:
    local: ${STORAGE_LOCAL:true}

spring:
  servelet:
    multipart:
      enabled: true
      file-size-threshold: 3MB
      max-file-size: 3MB
      max-request-size: 10MB

server:
  port: 8080